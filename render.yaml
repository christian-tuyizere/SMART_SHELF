services:
  - type: web
    name: smartshelf
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_PASSWORD
        sync: false
      - key: YCLOUD_API_KEY
        sync: false
      - key: YCLOUD_FROM
        sync: false
      - key: SHOP_NAME
        sync: false
